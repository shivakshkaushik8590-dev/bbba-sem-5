services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitch-cafe-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stitch-cafe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
